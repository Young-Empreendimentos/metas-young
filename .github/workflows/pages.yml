name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: So publica se este commit ainda for o topo da main
        run: |
          git fetch --quiet origin main
          TIP=$(git rev-parse origin/main)
          if [ "$TIP" != "$GITHUB_SHA" ]; then
            echo "Commit $GITHUB_SHA nao e mais o topo da main ($TIP). Abortando para nao publicar versao antiga."
            exit 1
          fi
      - name: Paginas por URL (mesmo app em cada rota)
        run: |
          for r in criarmetas metas tabela pessoas; do
            mkdir -p "web/$r" && cp web/index.html "web/$r/index.html"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
